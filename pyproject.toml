[tool.ruff]
required-version = ">=0.17.2"
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"backend/manage.py" = ["E402"]
# O teste isolado configura Django antes de importar os modelos.
"tests/soak.py" = ["E402"]

[tool.coverage.run]
branch = true
source = ["core"]
omit = ["*/migrations/*", "*/test*.py", "*/management/*"]

[tool.coverage.report]
show_missing = true
